name: PisoBot

on:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/London"
    - cron: "0 18 * * *"
      timezone: "Europe/London"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Telegram messages, no state update)"
        type: boolean
        default: false
      report:
        description: "Send the full report (photo shortlist + grouped matches)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pisobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check report formatting
        run: python -m unittest discover -s tests
      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY || vars.TFL_APP_KEY }}
        run: python -m pisobot.main ${{ inputs.dry_run && '--dry-run' || '' }} ${{ (inputs.report || github.event_name == 'schedule') && '--report' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "pisobot"
          git config user.email "pisobot@users.noreply.github.com"
          git add state/ docs/
          git diff --cached --quiet || git commit -m "Update listing state and map [skip ci]"
          git push
