name: PisoBot

# Buttons and commands are handled instantly by the Cloudflare Worker (worker/).
# cron-job.org dispatches `scheduled: true` at 06:30 and 18:00 UK time; GitHub's own cron
# is throttled, so the hourly run below only catches up a report slot that was missed.
on:
  schedule:
    - cron: "40 * * * *"
      timezone: "Europe/London"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Telegram messages, no state update)"
        type: boolean
        default: false
      report:
        description: "Send the full report (photo shortlist + grouped matches)"
        type: boolean
        default: true
      scheduled:
        description: "Send the 06:30/18:00 report only if that slot is due (used by cron-job.org)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pisobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check report formatting
        run: python -m unittest discover -s tests
      - uses: actions/cache/restore@v4
        with:
          path: .cache/map-tiles
          key: osm-tiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: osm-tiles-${{ runner.os }}-
      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY || vars.TFL_APP_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
        run: |
          if [ "$SCHEDULED" = "true" ]; then
            python -m pisobot.main --scheduled
          else
            python -m pisobot.main ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.report && '--report' || '' }}
          fi
      - uses: actions/cache/save@v4
        if: success() && hashFiles('.cache/map-tiles.updated') != ''
        with:
          path: .cache/map-tiles
          key: osm-tiles-${{ runner.os }}-${{ github.run_id }}
      - name: Save state
        if: always()
        run: |
          git config user.name "pisobot"
          git config user.email "pisobot@users.noreply.github.com"
          git add state/ docs/
          git diff --cached --quiet || git commit -m "Update listing state and map [skip ci]"
          git push
