name: PisoBot

on:
  schedule:
    - cron: "17 6-22/2 * * *"   # every 2 hours, 06:17-22:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Telegram messages, no state update)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pisobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY || vars.TFL_APP_KEY }}
        run: python -m pisobot.main ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "pisobot"
          git config user.email "pisobot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update listing state [skip ci]"
          git push
