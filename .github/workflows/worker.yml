name: Worker tests

on:
  push:
    paths: ["worker/**"]
  pull_request:
    paths: ["worker/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: worker
